plugins {
    // java-library: koryki-core is 'api' -- the measures are checked against its Schema, and the
    // public signatures take and return its classes.
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.spotless)
}

description = 'koryki measures - named aggregates of the tables of a koryki catalog, kept beside the catalog and not in it'

java {
    // A fixed toolchain, so the class-file version does not depend on who builds (IDE or command line).
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

base.archivesName = 'koryki-measures'

dependencies {
    api libs.koryki.core
    // The measure catalog is a JSON file.
    implementation libs.jackson.databind

    testImplementation libs.koryki.northwind
    testImplementation libs.koryki.duckdb
    testImplementation libs.koryki.testkit
    // measures.json, the measures of the Northwind catalog. mavenLocal comes first (settings.gradle), so
    // a snapshot built in koryki-java/northwind is found; a release comes from Central.
    testImplementation libs.koryki.northwind.catalog
    // The TPC-DS catalog (with its measures.json) and database, for the tpcds corpus. Same resolution.
    testImplementation libs.koryki.tpcds.catalog
    testImplementation libs.koryki.tpcds.duckdb
    // The SCOTT catalog and database, for the scott corpus (the data of Apache Ossie's query compliance cases).
    testImplementation libs.koryki.scott.catalog
    testImplementation libs.koryki.scott.duckdb
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

// AOSP variant (4-space indent), as in koryki-java/core.
spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat(libs.versions.google.java.format.get()).aosp()
    }
}

// LICENSE and NOTICE travel with every jar, sources and javadoc included: whoever receives an
// artifact also receives the terms it is passed on under.
tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
    from('NOTICE') { into 'META-INF' }
}

tasks.named('jar') {
    manifest {
        attributes('Automatic-Module-Name': 'ai.koryki.measure')
    }
}

// The fixture corpora are read from checkouts of the repositories that own the catalogs, as in
// koryki-java/core: the test.root of a run is the root of one of them. Two corpora, two tasks:
//   ./gradlew test        koryki-java/northwind  (-Dtest.root=..., 'test.root' in gradle.properties, or ../northwind)
//   ./gradlew tpcdsTest   koryki-java/tpcds      (-Dtpcds.root=..., 'tpcds.root' in gradle.properties, or ../tpcds)
// A golden is written only on request: ./gradlew test tpcdsTest -Dfixtures.write=true
def corpus = 'fixture/src/main/resources/ai/koryki/fixture'
def fixtureRoot = { String property, String sibling ->
    System.getProperty(property)
            ?: providers.gradleProperty(property).orNull
            ?: (file(sibling).isDirectory() ? file(sibling).absolutePath : null)
}
def withCorpus = { Test task, String root ->
    task.useJUnitPlatform()
    task.systemProperty 'fixtures.write', System.getProperty('fixtures.write', 'false')
    if (root != null) {
        task.systemProperty 'test.root', root
        task.systemProperty 'test.corpus', corpus
        // Without this a changed fixture would leave the test UP-TO-DATE.
        task.inputs.dir(file(root).toPath().resolve(corpus).toFile())
                .withPropertyName('corpus')
                .withPathSensitivity(PathSensitivity.RELATIVE)
                .optional()
    }
    task.testLogging { exceptionFormat 'full' }
}

test {
    exclude '**/tpcds/**', '**/scott/**'
    withCorpus(it, fixtureRoot('test.root', '../northwind'))
}

tasks.register('tpcdsTest', Test) {
    description = 'The rewriter against the TPC-DS measures corpus (koryki-java/tpcds).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/tpcds/**'
    withCorpus(it, fixtureRoot('tpcds.root', '../tpcds'))
}

tasks.register('scottTest', Test) {
    description = 'The rewriter against the SCOTT measures corpus (koryki-java/scott), and the results of the Apache Ossie cases.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/scott/**'
    withCorpus(it, fixtureRoot('scott.root', '../scott'))
    // A checkout of apache/ossie, for the expected.sql of its query cases (-Dossie.root, or 'ossie.root').
    def ossie = System.getProperty('ossie.root') ?: providers.gradleProperty('ossie.root').orNull
    if (ossie != null) {
        systemProperty 'ossie.root', ossie
    }
}

tasks.named('check') { dependsOn 'tpcdsTest', 'scottTest' }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'koryki-measures'
            pom {
                name = 'koryki-measures'
                description = project.description
                url = 'https://github.com/koryki-java/measures'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'j0hannesz'
                        name = 'Johannes Zemlin'
                        email = 'johannes.zemlin@mailbox.org'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/koryki-java/measures.git'
                    developerConnection = 'scm:git:git@github.com:koryki-java/measures.git'
                    url = 'https://github.com/koryki-java/measures'
                }
            }
        }
    }
}
