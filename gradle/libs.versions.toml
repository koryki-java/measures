[versions]

# Aligned with koryki-java/core.
jackson = "3.3.0"
junit = "6.1.3"
spotless = "8.11.0"
google-java-format = "1.36.1"

# One version per koryki repository this project builds against.
koryki-core = "0.4.2"

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]

jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }

koryki-core = { module = "ai.koryki.core:koryki-core", version.ref = "koryki-core" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" } # version comes from BOM
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" } # version comes from BOM
