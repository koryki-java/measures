[versions]

# Aligned with koryki-java/core.
jackson = "3.3.0"
junit = "6.1.3"
spotless = "8.11.0"
google-java-format = "1.36.1"

# One version per koryki repository this project builds against.
koryki-core = "0.4.3-SNAPSHOT"
# The northwind repository: the catalog (with its measures.json) and the shared fixture corpus.
koryki-northwind-catalog-version = "0.4.2-SNAPSHOT"
# The tpcds repository: the catalog (with its measures.json) and the DuckDB database.
koryki-tpcds-version = "0.1.3-SNAPSHOT"
# The scott repository: the catalog (with its measures.json) and the DuckDB database.
koryki-scott-version = "0.1.0-SNAPSHOT"

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]

jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }

koryki-core = { module = "ai.koryki.core:koryki-core", version.ref = "koryki-core" }
# Tests only: the Northwind catalog and its DuckDB database, and the DuckDB dialect.
koryki-northwind = { module = "ai.koryki.core:koryki-northwind", version.ref = "koryki-core" }
koryki-testkit = { module = "ai.koryki.core:koryki-testkit", version.ref = "koryki-core" }
koryki-northwind-catalog = { module = "ai.koryki.northwind:koryki-northwind-catalog", version.ref = "koryki-northwind-catalog-version" }
koryki-tpcds-catalog = { module = "ai.koryki.tpcds:koryki-tpcds-catalog", version.ref = "koryki-tpcds-version" }
koryki-tpcds-duckdb = { module = "ai.koryki.tpcds:koryki-tpcds-duckdb", version.ref = "koryki-tpcds-version" }
koryki-scott-catalog = { module = "ai.koryki.scott:koryki-scott-catalog", version.ref = "koryki-scott-version" }
koryki-scott-duckdb = { module = "ai.koryki.scott:koryki-scott-duckdb", version.ref = "koryki-scott-version" }
koryki-duckdb = { module = "ai.koryki.core:koryki-duckdb", version.ref = "koryki-core" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" } # version comes from BOM
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" } # version comes from BOM
