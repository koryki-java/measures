rootProject.name = 'measures'

dependencyResolutionManagement {
    // Do not allow the project to define other repositories
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        // Only koryki's own artifacts may come from the local repository: for developing against a
        // core change before it is published. Everything else comes from Central, never from a
        // stale local copy.
        mavenLocal {
            content { includeGroupByRegex 'ai\\.koryki(\\..+)?' }
        }
        mavenCentral()
    }
}
